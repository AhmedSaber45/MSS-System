name: Release & Automatic Update Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Sign Windows Release (NSIS & MSI)
    runs-on: windows-latest
    env:
      VITE_ADMIN_API_URL: ${{ vars.VITE_ADMIN_API_URL || 'https://assystemadmindashboard.vercel.app' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Test Verification Suite
        run: npm test

      - name: Build Frontend Assets
        run: npm run build
        env:
          VITE_ADMIN_API_URL: ${{ vars.VITE_ADMIN_API_URL || 'https://assystemadmindashboard.vercel.app' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify Release Secrets Configuration
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::CRITICAL: TAURI_SIGNING_PRIVATE_KEY secret is missing! Please configure it in GitHub repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Release signing secrets verified."

      - name: Build Tauri Desktop Package & Sign Release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_ADMIN_API_URL: ${{ vars.VITE_ADMIN_API_URL || 'https://assystemadmindashboard.vercel.app' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          projectPath: './'
          tagName: ${{ github.ref_name }}
          releaseName: 'AS System v__VERSION__'
          releaseBody: |
            ## AS System v__VERSION__ Release Notes
            - MSS Dashboard Recent Sales: Removed stale local cached and demo records; section now strictly reflects genuine cloud sales and displays clean empty states.
            - MSS Invoices: Prevented deleted cloud invoices from reappearing through stale local cache, while preserving legitimate pending offline transactions.
            - MSS Sales Reports: Filtered 14-day sales activity to genuine active days and added interactive column sorting.
            - MSS Promotional Image Generator: Fixed price input field behavior so placeholder is purely visual guidance and entered numbers are never prefixed with extra zeros.
            - Preserved local SQLite database integrity, remote cloud records, and existing authentication/permission systems safely.
            - Transparent auto-updater signed with verified official release keys.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --ignore-version-mismatches
